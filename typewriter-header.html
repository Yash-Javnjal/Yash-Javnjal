<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yash Javanjal - Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .typewriter-container {
            max-width: 900px;
            width: 100%;
        }

        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: #e8e6e3;
            line-height: 1.6;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #e8e6e3;
            margin-left: 2px;
            vertical-align: text-bottom;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .typewriter-text {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .typewriter-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="typewriter-container">
        <div class="typewriter-text" id="text"></div>
    </div>

    <script>
        const fullText = "Yash Javanjal — Full-stack developer focused on building calm, reliable systems with clean architecture and thoughtful design.";
        const textElement = document.getElementById('text');
        let index = 0;
        let cursorElement = null;

        function typeWriter() {
            if (index === 0) {
                // Add cursor at the start
                cursorElement = document.createElement('span');
                cursorElement.className = 'cursor';
                textElement.appendChild(cursorElement);
            }

            if (index < fullText.length) {
                const char = fullText.charAt(index);
                const textNode = document.createTextNode(char);
                
                // Insert character before cursor
                textElement.insertBefore(textNode, cursorElement);
                
                index++;
                
                // Determine delay based on character
                let delay = 85; // Base typing speed
                
                if (char === '—') {
                    delay = 400; // Longer pause for em dash
                } else if (char === ',' || char === '.') {
                    delay = 300; // Pause at punctuation
                } else if (char === ' ') {
                    delay = 65; // Slightly faster for spaces
                }
                
                setTimeout(typeWriter, delay);
            } else {
                // Remove cursor after typing completes
                if (cursorElement) {
                    setTimeout(() => {
                        cursorElement.style.opacity = '0';
                        setTimeout(() => {
                            cursorElement.remove();
                        }, 300);
                    }, 500);
                }
            }
        }

        // Start typing after a brief moment
        setTimeout(typeWriter, 800);
    </script>
</body>
</html>
